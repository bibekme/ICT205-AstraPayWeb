<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AstraPay – Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f0f4fa;
        --surface: #ffffff;
        --border: #dce4f0;
        --accent: #0066ff;
        --accent2: #6d28d9;
        --text: #0f1e35;
        --muted: #6b82a0;
        --danger: #dc2626;
        --success: #059669;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        position: relative;
      }

      /* Animated background grid */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.6;
        animation: gridPulse 8s ease-in-out infinite;
      }

      @keyframes gridPulse {
        0%,
        100% {
          opacity: 0.6;
        }
        50% {
          opacity: 0.3;
        }
      }

      /* Soft colour blobs */
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(100px);
        opacity: 0.1;
        animation: float 10s ease-in-out infinite;
      }
      .orb-1 {
        width: 400px;
        height: 400px;
        background: var(--accent);
        top: -100px;
        right: -100px;
      }
      .orb-2 {
        width: 300px;
        height: 300px;
        background: var(--accent2);
        bottom: -50px;
        left: -50px;
        animation-delay: -5s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) scale(1);
        }
        50% {
          transform: translateY(-20px) scale(1.05);
        }
      }

      .login-wrapper {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 420px;
        padding: 20px;
      }

      .brand {
        text-align: center;
        margin-bottom: 40px;
        animation: slideDown 0.6s ease;
      }

      @keyframes slideDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .brand-logo {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }

      .brand-icon {
        width: 44px;
        height: 44px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        box-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
      }

      .brand-name {
        font-family: "Syne", sans-serif;
        font-size: 28px;
        font-weight: 800;
        background: linear-gradient(135deg, var(--accent), #a78bfa);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .brand-tagline {
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.05em;
      }

      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 36px;
        box-shadow:
          0 8px 40px rgba(0, 0, 0, 0.08),
          0 0 0 1px rgba(0, 0, 0, 0.04);
        animation: slideUp 0.6s ease 0.1s both;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .card h2 {
        font-family: "Syne", sans-serif;
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 6px;
      }

      .card .subtitle {
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 28px;
      }

      .field {
        margin-bottom: 18px;
      }

      label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 8px;
      }

      input {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 13px 16px;
        color: var(--text);
        font-family: "DM Sans", sans-serif;
        font-size: 15px;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
        outline: none;
      }

      input:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.1);
      }

      input::placeholder {
        color: var(--muted);
      }

      .btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        border: none;
        border-radius: 10px;
        color: #fff;
        font-family: "Syne", sans-serif;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        letter-spacing: 0.03em;
        margin-top: 8px;
        transition:
          opacity 0.2s,
          transform 0.1s;
        box-shadow: 0 4px 20px rgba(0, 102, 255, 0.2);
      }

      .btn:hover {
        opacity: 0.9;
      }
      .btn:active {
        transform: scale(0.98);
      }

      .error-box {
        background: rgba(255, 71, 87, 0.1);
        border: 1px solid rgba(255, 71, 87, 0.3);
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 20px;
        font-size: 13px;
        color: var(--danger);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .footer-note {
        text-align: center;
        margin-top: 20px;
        font-size: 12px;
        color: var(--muted);
        animation: slideUp 0.6s ease 0.2s both;
      }

      .security-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: rgba(5, 150, 105, 0.08);
        border: 1px solid rgba(5, 150, 105, 0.2);
        border-radius: 20px;
        padding: 4px 12px;
        font-size: 11px;
        color: var(--success);
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="login-wrapper">
      <div class="brand">
        <div class="brand-logo">
          <div class="brand-icon">₳</div>
          <span class="brand-name">AstraPay</span>
        </div>
        <div class="brand-tagline">Digital Wallet &amp; Financial Platform</div>
      </div>

      <div class="card">
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to your AstraPay account</p>

        {% if error %}
        <div class="error-box"><span>⚠</span> {{ error }}</div>
        {% endif %}

        <form method="POST">
          <div class="field">
            <label>Username</label>
            <input
              type="text"
              name="username"
              placeholder="Enter your username"
              autocomplete="off"
              required
            />
          </div>
          <div class="field">
            <label>Password</label>
            <input
              type="password"
              name="password"
              placeholder="Enter your password"
              required
            />
          </div>
          <button type="submit" class="btn">Sign In →</button>
        </form>
      </div>

      <div class="footer-note">
        AstraPay Digital Systems Pty Ltd
        <br />
      </div>
    </div>
  </body>
</html>
